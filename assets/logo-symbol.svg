<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Símbolo de Numora</title>
  <defs>
    <linearGradient id="pillar" x1="8" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cff"/>
