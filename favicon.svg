    <path d="M21 22 43 43" fill="none" stroke="url(#whiteRibbon)" stroke-width="12" stroke-linecap="round"/>
    <path d="M15 30.5c5.5.9 10.2 3.5 15 8.4l-4.7 4.8C21.4 39.6 18 37.6 15 36.8Z" fill="url(#fold)" clip-path="url(#leftPillar)"/>
