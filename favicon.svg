<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Numora</title>
  <defs>
    <linearGradient id="tile" x1="7" y1="5" x2="58" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8959ff"/>
      <stop offset="0.55" stop-color="#6d38f5"/>
      <stop offset="1" stop-color="#5624cf"/>
    </linearGradient>
    <linearGradient id="whiteRibbon" x1="17" y1="18" x2="47" y2="47" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset="0.55" stop-color="#fbfaff"/>
      <stop offset="1" stop-color="#eeeaff"/>
    </linearGradient>
    <linearGradient id="fold" x1="16" y1="31" x2="31" y2="43" gradientUnits="userSpaceOnUse">
